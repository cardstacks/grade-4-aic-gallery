name: Prepare gallery images

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'images/**'
      - '.github/workflows/download-images.yml'

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gallery
        uses: actions/checkout@v4

      - name: Download Art Institute images
        shell: python
        run: |
          import os, re, urllib.request
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          # Read the slot and AIC ID from the artwork data already in index.html.
          pairs = re.findall(r'"slot":"(\d+)".*?"aic_id":"(\d+)"', html, re.S)
          if not pairs:
              raise SystemExit('No artwork slot/AIC ID pairs were found in index.html')

          out = Path('images')
          out.mkdir(exist_ok=True)
          for slot, aic_id in pairs:
              target = out / f'{slot}.jpg'
              url = f'https://www.artic.edu/iiif/2/{aic_id}/full/843,/0/default.jpg'
              print(f'Downloading {slot}.jpg from AIC {aic_id}')
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=45) as r, open(target, 'wb') as f:
                      f.write(r.read())
              except Exception as e:
                  print(f'WARNING: could not download {slot}.jpg: {e}')

          # Make the gallery use its own local copies instead of requesting images
          # directly from artic.edu in visitors' browsers.
          html = re.sub(
              r'https://www\.artic\.edu/iiif/2/\$\{x\.aic_id\}/full/843,/0/default\.jpg',
              'images/${x.slot}.jpg',
              html
          )
          Path('index.html').write_text(html, encoding='utf-8')
      - name: Commit prepared images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html images/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add local gallery images'
            git push
          fi
